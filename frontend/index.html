<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelArt Studio</title>
    <style>
      .menu-group a { text-decoration: none; color: inherit; margin-left: 10px; }
      .menu-group a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <!-- Login/Register Container -->
    <div id="auth-container" class="auth-container">
      <div id="login-form" class="auth-form">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <input type="text" id="loginUsuario" placeholder="Usuario" required />
          <input type="password" id="loginPassword" placeholder="Contraseña" required />
          <button type="submit">Entrar</button>
        </form>
        <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
      </div>
      
      <div id="register-form" class="auth-form hidden">
        <h2>Registro</h2>
        <form id="registerForm">
          <input type="text" id="regNombre" placeholder="Nombre completo" required />
          <input type="text" id="regUsuario" placeholder="Usuario" required />
          <input type="email" id="regCorreo" placeholder="Correo electrónico" required />
          <input type="password" id="regPassword" placeholder="Contraseña" required />
          <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
      </div>
    </div>

    <!-- Main App Container (hidden until logged in) -->
    <div id="app-container" class="app-container hidden">
      <!-- Top Menu Bar -->
      <header class="menu-bar">
        <div class="menu-group">
          <button id="btnNew">Nuevo</button>
          <button id="btnOpen">Abrir</button>
          <button id="btnSave">Guardar</button>
          <button id="btnExport">Exportar</button>
          <select id="exportFormat">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="gif">GIF</option>
          </select>
          <button id="btnVerifyIntegrity" title="Verificar integridad de píxeles (Pixel-Cop)">🛡️ Pixel-Cop</button>
        </div>
        <div class="menu-group">
          <span id="user-display"></span>
          <button id="btnLogout">Cerrar Sesión</button>
          <a href="/comunidad.html" title="Ver galería comunitaria">🌐 Ver Comunidad</a>
        </div>
      </header>

      <!-- Main Workspace -->
      <div class="workspace">
        <!-- Left Toolbar -->
        <aside class="toolbar">
          <h3>Herramientas</h3>
          <button class="tool-btn active" data-tool="brush" title="Pincel">🖌️</button>
          <button class="tool-btn" data-tool="eraser" title="Goma">🧽</button>
          <button class="tool-btn" data-tool="fill" title="Relleno">🪣</button>
          <button class="tool-btn" data-tool="picker" title="Selector de color">💉</button>
          <button class="tool-btn" data-tool="selection" title="Selección">⬚</button>
          
          <div class="tool-options" id="selectionOptions" style="display: none;">
            <button id="btnDeleteSelection" title="Borrar selección">🗑️ Borrar Área</button>
            <button id="btnCancelSelection" title="Cancelar selección">❌ Cancelar</button>
          </div>
          
          <!-- Brush Options (collapsed by default, expands when brush is selected) -->
          <div class="tool-options brush-options" id="brushOptions">
            <label>🖌️ Pincel</label>
            <select id="brushType" title="Tipo de pincel">
              <option value="round">Redondo</option>
              <option value="square">Cuadrado</option>
              <option value="spray">Spray</option>
              <option value="pencil">Lápiz</option>
              <option value="marker">Marcador</option>
            </select>
            <label>Tamaño:</label>
            <input type="range" id="brushSize" min="1" max="50" value="5" />
            <span id="brushSizeValue">5px</span>
            
            <!-- Color Picker inside Brush Options -->
            <details class="color-details">
              <summary>🎨 Color</summary>
              <div class="color-content">
                <input type="color" id="colorPicker" value="#000000" />
                <div class="color-presets">
                  <span class="preset-color" data-color="#000000"></span>
                  <span class="preset-color" data-color="#ffffff"></span>
                  <span class="preset-color" data-color="#ff0000"></span>
                  <span class="preset-color" data-color="#00ff00"></span>
                  <span class="preset-color" data-color="#0000ff"></span>
                  <span class="preset-color" data-color="#ffff00"></span>
                  <span class="preset-color" data-color="#ff00ff"></span>
                  <span class="preset-color" data-color="#00ffff"></span>
                  <span class="preset-color" data-color="#808080"></span>
                  <span class="preset-color" data-color="#800000"></span>
                  <span class="preset-color" data-color="#808000"></span>
                  <span class="preset-color" data-color="#008000"></span>
                </div>
              </div>
            </details>
          </div>
          
          <!-- Undo/Redo Controls -->
          <div class="tool-options">
            <label>Historial:</label>
            <button id="btnUndo" title="Deshacer (Ctrl+Z)">↩️</button>
            <button id="btnRedo" title="Rehacer (Ctrl+Y)">↪️</button>
          </div>
          
          <!-- Zoom Controls -->
          <div class="tool-options">
            <label>Zoom:</label>
            <button id="btnZoomOut" title="Alejar">➖</button>
            <span id="zoomValue">100%</span>
            <button id="btnZoomIn" title="Acercar">➕</button>
            <button id="btnZoomReset" title="Resetear zoom">🔄</button>
          </div>
          
          <!-- Canvas Resize Options -->
          <div class="tool-options">
            <label>📐 Lienzo</label>
            <button id="btnResizeCanvas" title="Cambiar tamaño del lienzo">✂️ Redimensionar</button>
          </div>
          
          <!-- Theme Toggle -->
          <div class="tool-options">
            <button id="btnToggleTheme" title="Cambiar tema claro/oscuro">🌓 Tema</button>
          </div>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area">
          <div id="canvas-container" class="canvas-container">
            <!-- Layers will be created here dynamically -->
          </div>
        </main>

        <!-- Right Panel - Layers -->
        <aside class="layers-panel">
          <h3>Capas</h3>
          <div class="layers-controls">
            <button id="btnAddLayer">➕ Nueva</button>
            <button id="btnDeleteLayer">🗑️ Eliminar</button>
            <button id="btnMergeDown">⬇️ Fusionar</button>
          </div>
          <div id="layers-list" class="layers-list">
            <!-- Layer items will be added here -->
          </div>
        </aside>
      </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

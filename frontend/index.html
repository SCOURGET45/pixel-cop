<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error404 Studio</title>
    <style>
      .menu-group a { text-decoration: none; color: inherit; margin-left: 10px; }
      .menu-group a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <!-- Login/Register Container -->
    <div id="auth-container" class="auth-container">
      <div id="login-form" class="auth-form">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <input type="text" id="loginUsuario" placeholder="Usuario" required />
          <input type="password" id="loginPassword" placeholder="Contraseña" required />
          <button type="submit">Entrar</button>
        </form>
        <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
      </div>
      
      <div id="register-form" class="auth-form hidden">
        <h2>Registro</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="regNombre">Nombre completo:</label>
            <input type="text" id="regNombre" placeholder="Ej: Juan Pérez" required title="Tu nombre completo" />
          </div>
          
          <div class="form-group">
            <label for="regUsuario">Nombre de usuario:</label>
            <input type="text" id="regUsuario" placeholder="Ej: artista_pixel" required title="Nombre único para tu cuenta (sin espacios)" pattern="[a-zA-Z0-9_]+" />
            <small>Solo letras, números y guiones bajos</small>
          </div>
          
          <div class="form-group">
            <label for="regCorreo">Correo electrónico:</label>
            <input type="email" id="regCorreo" placeholder="Ej: juan@ejemplo.com" required title="Tu correo electrónico válido" />
          </div>
          
          <div class="form-group">
            <label for="regPassword">Contraseña:</label>
            <input type="password" id="regPassword" placeholder="Ej: MiClave123!" required title="Contraseña segura (mínimo 6 caracteres)" minlength="6" />
            <small>Mínimo 6 caracteres</small>
          </div>
          
          <div id="registerError" class="error-message hidden"></div>
          <div id="registerSuccess" class="success-message hidden"></div>
          
          <button type="submit" id="btnRegisterSubmit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
      </div>
    </div>

    <!-- Main App Container (hidden until logged in) -->
    <div id="app-container" class="app-container hidden">
      <!-- Top Menu Bar -->
      <header class="menu-bar">
        <div class="menu-group">
          <button id="btnNew">Nuevo</button>
          <button id="btnOpen">Abrir</button>
          <button id="btnSave">Guardar</button>
          <button id="btnExport">Exportar</button>
          <select id="exportFormat">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="gif">GIF</option>
          </select>
          <button id="btnVerifyIntegrity" title="Verificar integridad de píxeles">🛡️ Verificar</button>
        </div>
        <div class="menu-group">
          <span id="user-display"></span>
          <button id="btnLogout">Cerrar Sesión</button>
          <a href="/comunidad.html" title="Ver galería comunitaria">🌐 Ver Comunidad</a>
        </div>
      </header>

      <!-- Main Workspace -->
      <div class="workspace">
        <!-- Left Toolbar -->
        <aside class="toolbar">
          <!-- Herramientas Principales (siempre visibles) -->
          <div class="tool-section">
            <h3>Herramientas</h3>
            <div class="tools-grid">
              <button class="tool-btn active" data-tool="brush" title="Pincel (B)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                  <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                  <path d="M2 2l7.586 7.586"/>
                  <circle cx="11" cy="11" r="2"/>
                </svg>
              </button>
              <button class="tool-btn" data-tool="eraser" title="Goma (E)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M20 20H7L3 16V7l5-5h10l4 4v10l-4 4z"/>
                  <path d="M12 7l5 5"/>
                </svg>
              </button>
              <button class="tool-btn" data-tool="fill" title="Relleno (G)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M19 11l-8-8-8.6 8.6a2 2 0 000 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11z"/>
                  <path d="M5 2l5 5"/>
                  <path d="M13 7l4 4"/>
                </svg>
              </button>
              <button class="tool-btn" data-tool="picker" title="Selector (I)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 2L2 22h20L12 2z"/>
                  <circle cx="12" cy="14" r="3"/>
                </svg>
              </button>
              <button class="tool-btn" data-tool="selection" title="Selección (M)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <circle cx="15.5" cy="8.5" r="1.5"/>
                  <circle cx="8.5" cy="15.5" r="1.5"/>
                  <circle cx="15.5" cy="15.5" r="1.5"/>
                </svg>
              </button>
            </div>
          </div>
          
          <!-- Opciones de Selección (solo visible cuando se usa selección) -->
          <div class="tool-options" id="selectionOptions" style="display: none;">
            <button id="btnDeleteSelection" title="Borrar selección">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
              </svg>
              Borrar
            </button>
            <button id="btnCancelSelection" title="Cancelar selección">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <path d="M15 9l-6 6M9 9l6 6"/>
              </svg>
              Cancelar
            </button>
          </div>
          
          <!-- Opciones del Pincel/Goma (desplegable) -->
          <details class="tool-details" id="brushDetails" open>
            <summary class="tool-summary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
              </svg>
              Pincel
            </summary>
            <div class="tool-content">
              <label>Tipo:</label>
              <select id="brushType" title="Tipo de pincel">
                <option value="round">Redondo</option>
                <option value="square">Cuadrado</option>
                <option value="spray">Spray</option>
                <option value="pencil">Lápiz</option>
                <option value="marker">Marcador</option>
              </select>
              <label>Tamaño: <span id="brushSizeValue">5px</span></label>
              <input type="range" id="brushSize" min="1" max="50" value="5" />
              
              <!-- Color Picker -->
              <div class="color-picker-section">
                <label>Color:</label>
                <input type="color" id="colorPicker" value="#000000" />
                <div class="color-presets">
                  <span class="preset-color" data-color="#000000"></span>
                  <span class="preset-color" data-color="#ffffff"></span>
                  <span class="preset-color" data-color="#ff0000"></span>
                  <span class="preset-color" data-color="#00ff00"></span>
                  <span class="preset-color" data-color="#0000ff"></span>
                  <span class="preset-color" data-color="#ffff00"></span>
                  <span class="preset-color" data-color="#ff00ff"></span>
                  <span class="preset-color" data-color="#00ffff"></span>
                  <span class="preset-color" data-color="#808080"></span>
                  <span class="preset-color" data-color="#800000"></span>
                  <span class="preset-color" data-color="#808000"></span>
                  <span class="preset-color" data-color="#008000"></span>
                </div>
              </div>
            </div>
          </details>
          
          <!-- Acciones Rápidas (siempre visibles) -->
          <div class="tool-section">
            <h3>Acciones</h3>
            <div class="actions-grid">
              <button id="btnUndo" title="Deshacer (Ctrl+Z)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M3 10h10a5 5 0 015 5v2"/>
                  <path d="M7 6L3 10l4 4"/>
                </svg>
              </button>
              <button id="btnRedo" title="Rehacer (Ctrl+Y)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 10H11a5 5 0 00-5 5v2"/>
                  <path d="M17 6l4 4-4 4"/>
                </svg>
              </button>
              <button id="btnZoomOut" title="Alejar (-)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="M21 21l-4.35-4.35"/>
                  <path d="M8 11h6"/>
                </svg>
              </button>
              <button id="btnZoomIn" title="Acercar (+)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="M21 21l-4.35-4.35"/>
                  <path d="M11 8v6M8 11h6"/>
                </svg>
              </button>
            </div>
            <div class="zoom-info">
              <span id="zoomValue">100%</span>
              <button id="btnZoomReset" title="Resetear zoom (0)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>
          </div>
          
          <!-- Herramientas Avanzadas (desplegable) -->
          <details class="tool-details">
            <summary class="tool-summary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
              </svg>
              Avanzadas
            </summary>
            <div class="tool-content">
              <button id="btnResizeCanvas" title="Cambiar tamaño del lienzo" style="width: 100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
                Redimensionar Lienzo
              </button>
              <button id="btnToggleTheme" title="Cambiar tema claro/oscuro" style="width: 100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="5"/>
                  <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                Cambiar Tema
              </button>
            </div>
          </details>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area">
          <div id="canvas-container" class="canvas-container">
            <!-- Layers will be created here dynamically -->
          </div>
        </main>

        <!-- Right Panel - Layers -->
        <aside class="layers-panel">
          <h3>Capas</h3>
          <div class="layers-controls">
            <button id="btnAddLayer">➕ Nueva</button>
            <button id="btnDeleteLayer">🗑️ Eliminar</button>
            <button id="btnMergeDown">⬇️ Fusionar</button>
          </div>
          <div id="layers-list" class="layers-list">
            <!-- Layer items will be added here -->
          </div>
        </aside>
      </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
